services:
  dashboard:
    build: .
    image: "fitness-dashboard:local"
    working_dir: /home/node/app
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_DEPLOYMENT_ADAPTER=${NEXT_DEPLOYMENT_ADAPTER:-}
      - NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000}
    volumes:
      - ./:/home/node/app
      - dashboard-node-modules:/home/node/app/node_modules
      - dashboard-next:/home/node/app/.next
      - dashboard-keys:/home/node/.fitness-dashboard-keys
    expose:
      - "3000"
    ports:
      - "3000:3000"

volumes:
  dashboard-keys:
  dashboard-node-modules:
  dashboard-next:
