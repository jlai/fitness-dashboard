name: Publish Docker image

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the source changed
        id: changes
        shell: bash
        run: |
          published_sha="$(git rev-parse -q --verify refs/tags/dockerhub-published^{commit} || true)"
          if [[ "$published_sha" == "$GITHUB_SHA" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No changes since the last published image."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Source changed; building image."
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.changes.outputs.needed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        if: steps.changes.outputs.needed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/fitness-dashboard
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish image
        if: steps.changes.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record published source revision
        if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dockerhub-published "$GITHUB_SHA"
          git push origin refs/tags/dockerhub-published --force
